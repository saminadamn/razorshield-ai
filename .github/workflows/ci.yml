name: CI

# The claim this repo makes is "the numbers reproduce and the model is served
# what it was trained on". CI exists to keep that claim true: it regenerates the
# dataset from scratch, re-runs the quality gate, and re-proves feature parity.
# A green badge here means those three things still hold on a clean machine.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A smaller dataset than the released 100k: CI is checking that every
      # stage runs and the gates pass, not reproducing the published metrics.
      - name: Generate dataset
        run: python -m razorshield.data.generate --out data/raw --n 30000

      - name: Quality gate
        run: python -m razorshield.data.validate --data data/raw

      - name: Train and compare models
        run: python -m razorshield.models.compare --data data/raw --out reports

      - name: SHAP explanations
        run: python -m razorshield.explain.run --data data/raw --out reports

      - name: Risk bands
        run: python -m razorshield.scoring.score --data data/raw --out reports

      - name: Training/serving feature parity
        run: python -m razorshield.serving.parity

      - name: Seed the event store
        run: python -m razorshield.serving.seed --db data/razorshield.db --score 200

      - name: API smoke test
        run: python -m razorshield.serving.demo

  reproducibility:
    name: Deterministic output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Same seed must give byte-identical data, or "reproducible" is a claim
      # rather than a fact.
      - name: Generate twice and compare
        run: |
          python -m razorshield.data.generate --out run_a --n 20000 --seed 42
          python -m razorshield.data.generate --out run_b --n 20000 --seed 42
          diff run_a/transactions.csv run_b/transactions.csv
          echo "byte-identical across runs"

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t razorshield:ci .

      - name: Run container and hit the endpoints
        run: |
          docker run -d --name rs -p 8077:8077 razorshield:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8077/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:8077/health
          echo
          echo "--- pages ---"
          for path in / /dashboard /checkout /static/theme.css /model /stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8077$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { echo "FAILED on $path"; docker logs rs; exit 1; }
          done
          echo "--- score a payment ---"
          curl -fsS -X POST http://127.0.0.1:8077/score             -H 'content-type: application/json'             -d '{"transaction_id":"CI_DOCKER_1","customer_id":"CUST_000001","amount":8450}'             | python -c "import json,sys; d=json.load(sys.stdin); print('  score', d['risk_score'], d['band']); assert 0 <= d['risk_score'] <= 100"
          docker rm -f rs
