[project]
name = "razorshield-ai"
version = "1.0.0"
description = "Transaction risk detection with calibrated risk bands and SHAP explanations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samina Parveen" }]
keywords = ["fraud-detection", "machine-learning", "explainability", "shap", "razorpay"]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
notebooks = ["matplotlib>=3.8", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[project.scripts]
razorshield-generate = "razorshield.data.generate:main"
razorshield-validate = "razorshield.data.validate:main"
razorshield-compare = "razorshield.models.compare:main"
razorshield-explain = "razorshield.explain.run:main"
razorshield-score = "razorshield.scoring.score:main"
razorshield-parity = "razorshield.serving.parity:main"
razorshield-seed = "razorshield.serving.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["razorshield*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP", "I", "C4", "RET", "ARG", "PTH"]
ignore = [
    # FastAPI's dependency injection is `arg = Depends(...)` by design. B008
    # flags every route in the app for a pattern the framework requires.
    "B008",
    # `Path.open()` over `open()` is a fair rule, but these are scripts reading
    # one file; the plain builtin is clearer here.
    "PTH123",
]

[tool.ruff.lint.per-file-ignores]
# Notebook generators build long literal strings of chart code.
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
